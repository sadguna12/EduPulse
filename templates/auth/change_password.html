{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block nav %}
<a href="{{ url_for(current_user.role + '.dashboard') }}" class="nav-item">
  <span class="nav-icon">🏠</span> Dashboard
</a>
{% endblock %}
{% block content %}
<div style="max-width:420px; margin:0 auto;">
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">🔑 Change Password</div>
        <div class="card-subtitle">Update your account password</div>
      </div>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="6">
        <div class="form-hint">Minimum 6 characters</div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="width:100%; justify-content:center;">Save Password</button>
    </form>
  </div>
</div>
{% endblock %}
